<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 127 46" width="127" height="46" role="img" aria-labelledby="t d">
<title id="t">Email</title><desc id="d">Email</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.up{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .8s ease both}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.05s steps(2,start) infinite}
.float{animation:float 11s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.sweep{animation:sweep 7s ease-in-out infinite}
.flow{animation:flow 1.1s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes blink{0%{opacity:1}100%{opacity:0}}
@keyframes float{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-16px) rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes sweep{0%,55%{transform:translateX(-340px)}100%{transform:translateX(1100px)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="b"><rect width="127" height="46" rx="10"/></clipPath>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect x=".75" y=".75" width="125.5" height="44.5" rx="10" fill="#1B1F2A" stroke="#6FCF97" stroke-opacity=".7" stroke-width="1.5"/>
<g clip-path="url(#b)"><rect width="70" height="46" fill="url(#sh)" transform="skewX(-18)" class="sweep" style="animation-duration:5s"/></g>
<circle cx="26" cy="23" r="12" fill="#6FCF97" fill-opacity=".16" stroke="#6FCF97" stroke-opacity=".6"/>
<text x="26" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#6FCF97" class="m">@</text>
<text x="50" y="29" font-size="17" font-weight="600" fill="#D8DEE9" textLength="51.0" lengthAdjust="spacingAndGlyphs" class="m " >Email</text>
</svg>
