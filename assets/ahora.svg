<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 196" width="800" height="196" role="img" aria-labelledby="t d">
<title id="t">Aprendiendo ahora: Azure SQL Database</title><desc id="d">Llevar mis APIs ASP.NET Core a una base de datos gestionada en Azure.</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.up{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .8s ease both}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.05s steps(2,start) infinite}
.float{animation:float 11s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.sweep{animation:sweep 7s ease-in-out infinite}
.flow{animation:flow 1.1s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes blink{0%{opacity:1}100%{opacity:0}}
@keyframes float{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-16px) rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes sweep{0%,55%{transform:translateX(-340px)}100%{transform:translateX(1100px)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="800" height="196" rx="14"/></clipPath>
<radialGradient id="glow"><stop offset="0" stop-color="#E8A33D" stop-opacity=".20"/><stop offset="1" stop-color="#E8A33D" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2A2F3D"/></pattern>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="800" height="196" fill="#1B1F2A"/>
<circle cx="730" cy="46" r="230" fill="url(#glow)" class="pulse" style="animation-duration:6s"/><rect width="800" height="196" fill="url(#dots)" opacity=".55"/>
<path d="M0 36V14A14 14 0 0 1 14 0H786A14 14 0 0 1 800 14V36Z" fill="#14171F"/>
<rect y="36" width="800" height="1" fill="#2A2F3D"/>
<circle cx="24" cy="18" r="5.5" fill="#E06C75" opacity=".8"/><circle cx="43" cy="18" r="5.5" fill="#E8A33D" opacity=".8"/><circle cx="62" cy="18" r="5.5" fill="#6FCF97" opacity=".8"/>
<text x="400.0" y="23" text-anchor="middle" font-size="14" fill="#7A8296" class="m">ahora.sh</text>
</g>
<g class="fade" style="animation-delay:.1s"><text x="36" y="78" font-size="17" font-weight="400" fill="#6FCF97" textLength="244.8" lengthAdjust="spacingAndGlyphs" class="m " >$ aprendiendo --en-curso</text></g>
<g class="up" style="animation-delay:.3s"><text x="36" y="120" font-size="32" font-weight="700" fill="#D8DEE9" textLength="345.6" lengthAdjust="spacingAndGlyphs" class="m " >Azure SQL Database</text></g>
<g class="up" style="animation-delay:.5s"><text x="36" y="152" font-size="17" font-weight="400" fill="#7A8296" textLength="489.6" lengthAdjust="spacingAndGlyphs" class="m " >Llevar mis APIs ASP.NET Core a una base de datos</text><text x="36" y="174" font-size="17" font-weight="400" fill="#7A8296" textLength="510.0" lengthAdjust="spacingAndGlyphs" class="m " >gestionada en Azure: mismo enfoque, nuevo destino.</text></g>
<g class="fade" style="animation-delay:.9s"><text x="590" y="138" font-size="15" font-weight="400" fill="#E8A33D" textLength="99.0" lengthAdjust="spacingAndGlyphs" class="m " >en progreso</text><rect x="590" y="150" width="18" height="10" rx="3" fill="#E8A33D" class="pulse" style="animation-delay:0.00s"/><rect x="614" y="150" width="18" height="10" rx="3" fill="#E8A33D" class="pulse" style="animation-delay:0.22s"/><rect x="638" y="150" width="18" height="10" rx="3" fill="#E8A33D" class="pulse" style="animation-delay:0.44s"/><rect x="662" y="150" width="18" height="10" rx="3" fill="#E8A33D" class="pulse" style="animation-delay:0.66s"/><rect x="686" y="150" width="18" height="10" rx="3" fill="#E8A33D" class="pulse" style="animation-delay:0.88s"/><rect x="710" y="150" width="18" height="10" rx="3" fill="#E8A33D" class="pulse" style="animation-delay:1.10s"/></g>
<g clip-path="url(#card)"><rect x="0" y="0" width="240" height="196" fill="url(#shine)" transform="skewX(-18)" class="sweep"/></g>
<rect x=".5" y=".5" width="799" height="195" rx="14" fill="none" stroke="#2A2F3D"/>
